name: Actualización mensual del ranking

on:
  schedule:
    - cron: "0 13 22 * *"   # día 22 de cada mes, 07:00 hora de Costa Rica (13:00 UTC)
  workflow_dispatch:
    inputs:
      periodo:
        description: "Periodo a publicar (AAAA-MM). Vacío = mes actual"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: ranking-mensual
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r pipeline/requirements.txt
      - name: Capturar, calcular y publicar
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.periodo }}" ]; then
            python3 pipeline/actualizar.py --periodo "${{ github.event.inputs.periodo }}"
          else
            python3 pipeline/actualizar.py
          fi
      - name: Confirmar y subir cambios
        run: |
          git config user.name "ranking-bot"
          git config user.email "278119855+recheverria-cr@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "Sin cambios"; exit 0
          fi
          git commit -m "Ranking $(date -u +%Y-%m): actualización mensual automática"
          git push
